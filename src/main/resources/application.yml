spring:
  application:
    name: ai-incident-intelligence

  datasource:
    # Sensitive/environment-specific values come from environment variables (see .env.example)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/incident_db}
    username: ${DB_USERNAME:incident_user}
    password: ${DB_PASSWORD:incident_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # "update" is fine for local development; production teams usually use
      # versioned SQL migrations (Flyway/Liquibase) instead. That is a later improvement.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    # Serialize java.time values (Instant) as ISO-8601 strings, e.g. 2026-09-06T10:30:00Z
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    # We return our own consistent error body via GlobalExceptionHandler
    include-message: never

app:
  security:
    jwt:
      # NEVER hard-code the real secret. In dev, export JWT_SECRET before running.
      # Must be at least 32 chars (256 bits) for HS256.
      secret: ${JWT_SECRET:change-me-in-local-dev-only-0123456789abcdef}
      access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION:15}
      refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION:7}
    # Comma-separated list of allowed origins for the future React frontend.
    # "allow all origins" is intentionally NOT supported to prevent insecure configs.
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.example.incident: INFO
    org.hibernate.SQL: DEBUG        # shows generated SQL in dev logs
    org.hibernate.orm.jdbc.bind: TRACE  # shows bound query parameters
